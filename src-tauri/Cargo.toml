[package]
name = "chartelis"
version = "0.1.10"
description = "A quiet space for words. A minimal Markdown editor."
authors = ["Chartelis"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "chartelis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-fs = "~2.6.0"
tauri-plugin-persisted-scope = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-http = "2"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_Security"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
